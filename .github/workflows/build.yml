name: Compilar APK Debug

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Corrigir Configurações, Ícones e Compilar
        shell: bash
        run: |
          # Se o build.gradle da raiz não existir, cria um básico para suportar o módulo app
          if [ ! -f "build.gradle" ]; then
            echo "Criando build.gradle na raiz..."
            echo "allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          fi

          # Cria o settings.gradle se não existir
          if [ ! -f "settings.gradle" ]; then
            echo "Criando settings.gradle..."
            echo "include ':app'" > settings.gradle
          fi

          # Cria pastas de mipmap e um ícone adaptativo caso faltem
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          if [ ! -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" ]; then
            echo "Criando ícone temporário ic_launcher.xml..."
            echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:color="#FF000000"/><foreground android:color="#FF000000"/></adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # Corrige o erro de flags de acessibilidade incompatíveis no XML se o ficheiro existir
          ACC_CONFIG="app/src/main/res/xml/accessibility_service_config.xml"
          if [ -f "$ACC_CONFIG" ]; then
            echo "A ajustar accessibility_service_config.xml..."
            # Remove temporariamente o atributo problemático ou substitui por uma flag válida
            sed -i 's/android:accessibilityFlags="[^"]*"/android:accessibilityFlags="flagDefault"/g' "$ACC_CONFIG" || true
          fi

          # Gera o gradlew e compila o projeto
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          retention-days: 1
