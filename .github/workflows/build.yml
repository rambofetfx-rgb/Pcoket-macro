name: Build Android APK (Manual)

on:
  workflow_dispatch: # Dispara apenas quando você clicar em "Run workflow" no GitHub

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar com Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Enviar Artefato do APK (Expira em 24h)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
