name: Compilar APK Debug

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Listar ficheiros para encontrar o projeto
        run: |
          echo "--- Conteúdo da raiz do repositório ---"
          ls -la
          echo "--- Procurando pelo gradlew ---"
          find . -name "gradlew"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão e Compilar com Gradle
        shell: bash
        run: |
          # Encontra o diretório exato do gradlew automaticamente e executa
          GRADLEW_PATH=$(find . -name "gradlew" -exec dirname {} \;)
          echo "Encontrado em: $GRADLEW_PATH"
          cd "$GRADLEW_PATH"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          retention-days: 1
