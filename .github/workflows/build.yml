name: Compilar APK Debug

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configurar Assinatura de Debug Fixa (Atualizar sem desinstalar)
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Corrigir Configurações, Ícones, Manifesto, Serviço e Compilar
        shell: bash
        run: |
          # 1. Se o build.gradle da raiz não existir, cria um básico
          if [ ! -f "build.gradle" ]; then
            echo "allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          fi

          # 2. Cria o settings.gradle se não existir
          if [ ! -f "settings.gradle" ]; then
            echo "include ':app'" > settings.gradle
          fi

          # 3. Injeta a chave de assinatura fixa no build.gradle do app se necessário
          APP_BUILD="app/build.gradle"
          if [ -f "$APP_BUILD" ]; then
            if ! grep -q "signingConfigs" "$APP_BUILD"; then
              echo "Injetando signingConfigs no app/build.gradle..."
              sed -i '/android {/a \    signingConfigs {\n        debug {\n            storeFile file(System.getenv("HOME") + "/.android/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }\n    }' "$APP_BUILD"
            fi
          fi

          # 4. Cria pastas de mipmap e ícone temporário se faltarem
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          if [ ! -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:color="#FF000000"/><foreground android:color="#FF000000"/></adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # 5. Corrige flags de acessibilidade no XML
          ACC_CONFIG="app/src/main/res/xml/accessibility_service_config.xml"
          if [ -f "$ACC_CONFIG" ]; then
            sed -i 's/android:accessibilityFlags="[^"]*"/android:accessibilityFlags="flagDefault"/g' "$ACC_CONFIG" || true
          fi

          # 6. Garante que o AndroidManifest.xml tem as permissões e o FloatingService registados corretamente
          MANIFEST_FILE="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            echo "A verificar e ajustar o AndroidManifest.xml..."
            
            # Garante permissão de Overlay (Janela Flutuante)
            if ! grep -q "SYSTEM_ALERT_WINDOW" "$MANIFEST_FILE"; then
              sed -i '/<application>/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' "$MANIFEST_FILE"
            fi

            # Regista o FloatingService se ainda não estiver lá
            if ! grep -q "FloatingService" "$MANIFEST_FILE"; then
              echo "Injetando FloatingService no AndroidManifest.xml..."
              sed -i '/<\/application>/i \        <service android:name=".FloatingService" android:exported="false" />' "$MANIFEST_FILE"
            fi
          fi

          # 7. Gera o gradlew e compila o projeto
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          retention-days: 1
