name: Compilar APK Debug

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Criar Estrutura do Gradle e Compilar APK
        shell: bash
        run: |
          # Se o build.gradle da raiz não existir, cria um básico para suportar o módulo app
          if [ ! -f "build.gradle" ]; then
            echo "Criando build.gradle na raiz..."
            echo "allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          fi

          # Cria o settings.gradle se não existir
          if [ ! -f "settings.gradle" ]; then
            echo "Criando settings.gradle..."
            echo "include ':app'" > settings.gradle
          fi

          # Força a criação do wrapper utilizando diretamente a versão 8.5 sem depender do gradle global
          npx @antfu/ni --version || true
          
          # Cria os ficheiros do wrapper manualmente para a versão 8.5.0
          mkdir -p gradle/wrapper
          cat <<EOF > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Baixa o gradlew executável compatível
          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew > gradlew
          chmod +x ./gradlew

          # Compila o projeto
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          retention-days: 1
