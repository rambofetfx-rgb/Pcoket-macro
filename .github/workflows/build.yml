name: Compilar APK Debug

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Criar Ficheiros e Gerar Gradle Wrapper
        shell: bash
        run: |
          # Se o build.gradle da raiz não existir, cria um básico para suportar o módulo app
          if [ ! -f "build.gradle" ]; then
            echo "Criando build.gradle na raiz..."
            echo "allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          fi

          # Cria o settings.gradle se não existir
          if [ ! -f "settings.gradle" ]; then
            echo "Criando settings.gradle..."
            echo "include ':app'" > settings.gradle
          fi

          # Gera o gradlew e os ficheiros de wrapper necessários na versão 8.5
          gradle wrapper --gradle-version 8.5 --distribution-type bin

          # Compila o projeto
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          retention-days: 1
